<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learn Vocab</title>
<style>
  body {
    font-family: Arial;
    padding: 20px;
    background: #f5f5f5;
  }
  h2 {
    text-align: center;
  }
  input {
    padding: 10px;
    width: 250px;
    font-size: 16px;
  }
  button {
    padding: 10px 15px;
    font-size: 16px;
    cursor: pointer;
  }
  .section {
    margin-top: 20px;
  }
  h3 {
    background: #ddd;
    padding: 8px;
    border-radius: 6px;
  }
  .card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

<h2>Learn Vocab</h2>

<input id="wordInput" placeholder="Enter a word...">
<button onclick="addWord()">Add</button>

<div id="output"></div>

<script>
let vocabData = JSON.parse(localStorage.getItem("vocabData")) || {
  noun: [],
  verb: [],
  adjective: [],
  adverb: [],
  other: []
};

async function addWord() {
  const input = document.getElementById("wordInput");
  let word = input.value.trim().toLowerCase();
  if (!word) return;

  input.value = "";

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    const data = await res.json();

    const meaning = data[0]?.meanings[0];
    let pos = meaning?.partOfSpeech || "other";
    if (!vocabData[pos]) pos = "other";

    const def = meaning?.definitions[0]?.definition || "No definition";
    const syn = meaning?.synonyms?.slice(0,5).join(", ") || "None";

    // tránh trùng
    if (vocabData[pos].some(item => item.word === word)) return;

    vocabData[pos].push({
      word: word,
      def: def,
      syn: syn
    });

    save();
    render();

  } catch {
    vocabData["other"].push({word, def:"Not found", syn:""});
    save();
    render();
  }
}

function save() {
  localStorage.setItem("vocabData", JSON.stringify(vocabData));
}

function render() {
  const output = document.getElementById("output");
  output.innerHTML = "";

  for (let type in vocabData) {
    if (vocabData[type].length === 0) continue;

    let section = `<div class="section"><h3>${type.toUpperCase()}</h3>`;

    vocabData[type].forEach(item => {
      section += `
        <div class="card">
          <b>${item.word}</b><br>
          Meaning: ${item.def}<br>
          Synonyms: ${item.syn}
        </div>
      `;
    });

    section += `</div>`;
    output.innerHTML += section;
  }
}

// load lại khi mở web
render();
</script>

</body>
</html>
